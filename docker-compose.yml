services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: donoryuks-app
    container_name: donoryuks-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/framework:/var/www/html/storage/framework
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-donoryuks}
      DB_USERNAME: ${DB_USERNAME:-donoryuks}
      DB_PASSWORD: ${DB_PASSWORD:-donoryuks}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - donoryuks
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: donoryuks-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - donoryuks
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: donoryuks-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-donoryuks}
      MARIADB_USER: ${DB_USERNAME:-donoryuks}
      MARIADB_PASSWORD: ${DB_PASSWORD:-donoryuks}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - donoryuks

volumes:
  dbdata:

networks:
  donoryuks:
    driver: bridge
